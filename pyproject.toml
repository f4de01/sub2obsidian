[project]
name = "sub2obsidian"
version = "0.1.0"
description = "把抖音、B站、公众号收藏采集成原始材料，并交给 agent 编译成 Obsidian LLM Wiki 知识库"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=15,<19",
    "beautifulsoup4>=4.15.0",
    "click>=8.1",
    "faster-whisper>=1.2.1",
    "markdownify>=1.2.3",
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform == 'win32'",
    "playwright>=1.63.0",
    "pyyaml>=6.0.2",  # F2 固定 pyyaml==6.0.2
    "tomli-w>=1.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
sub2obsidian = "sub2obsidian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sub2obsidian"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
